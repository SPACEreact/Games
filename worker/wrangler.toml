name = "gameadda-multiplayer"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "LOBBY", class_name = "GameLobby" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameLobby"]

[vars]
ALLOWED_ORIGINS = "https://spacereact.github.io,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173"
